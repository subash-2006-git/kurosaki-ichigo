# Render Blueprint (Dashboard > Blueprints > New Blueprint Instance, pick this repo).
# Not needed if the service was created by hand; it documents the same settings.
services:
  - type: web
    name: kurosaki-ichigo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SYNC_COMMANDS
        value: "true"
