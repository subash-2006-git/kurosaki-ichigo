# Lints (ruff) and runs the whole test suite on every push and pull request.
# The database tests start their own embedded Postgres (pgserver); no secrets are needed.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format github .
      - name: Test
        run: pytest -q
